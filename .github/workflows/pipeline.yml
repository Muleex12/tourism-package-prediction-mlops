name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. DATA REGISTRATION
  # ============================================================
  data-registration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements-github-actions.txt

      - name: Register dataset on Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj="data/tourism.csv",
              path_in_repo="tourism.csv",
              repo_id="Muleex12/tourism-package-prediction-data",
              repo_type="dataset"
          )

          print("Original tourism dataset registered successfully on Hugging Face.")
          PY


  # ============================================================
  # 2. DATA PREPARATION
  # ============================================================
  data-preparation:
    needs: data-registration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements-github-actions.txt

      - name: Prepare train and test datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from huggingface_hub import HfApi

          hf_dataset_url = (
              "https://huggingface.co/datasets/"
              "Muleex12/tourism-package-prediction-data/"
              "resolve/main/tourism.csv"
          )

          df = pd.read_csv(hf_dataset_url)

          print("Original dataset shape:", df.shape)

          df = df.drop(
              columns=["Unnamed: 0", "CustomerID"],
              errors="ignore"
          )

          df = df.drop_duplicates()

          print("Cleaned dataset shape:", df.shape)

          X = df.drop(columns=["ProdTaken"])
          y = df["ProdTaken"]

          X_train, X_test, y_train, y_test = train_test_split(
              X,
              y,
              test_size=0.20,
              random_state=42,
              stratify=y
          )

          train_df = X_train.copy()
          train_df["ProdTaken"] = y_train.values

          test_df = X_test.copy()
          test_df["ProdTaken"] = y_test.values

          os.makedirs("data", exist_ok=True)

          train_df.to_csv("data/train.csv", index=False)
          test_df.to_csv("data/test.csv", index=False)

          print("Train shape:", train_df.shape)
          print("Test shape:", test_df.shape)

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj="data/train.csv",
              path_in_repo="train.csv",
              repo_id="Muleex12/tourism-package-prediction-data",
              repo_type="dataset"
          )

          api.upload_file(
              path_or_fileobj="data/test.csv",
              path_in_repo="test.csv",
              repo_id="Muleex12/tourism-package-prediction-data",
              repo_type="dataset"
          )

          print("Train and test datasets uploaded successfully to Hugging Face.")
          PY


  # ============================================================
  # 3. MODEL TRAINING + EXPERIMENT TRACKING
  # ============================================================
  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements-github-actions.txt

      - name: Train, tune and register model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import joblib
          import mlflow
          import mlflow.sklearn
          import pandas as pd

          from sklearn.compose import ColumnTransformer
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import (
              accuracy_score,
              precision_score,
              recall_score,
              f1_score
          )
          from sklearn.model_selection import GridSearchCV
          from sklearn.preprocessing import OneHotEncoder
          from huggingface_hub import HfApi

          train_url = (
              "https://huggingface.co/datasets/"
              "Muleex12/tourism-package-prediction-data/"
              "resolve/main/train.csv"
          )

          test_url = (
              "https://huggingface.co/datasets/"
              "Muleex12/tourism-package-prediction-data/"
              "resolve/main/test.csv"
          )

          train_df = pd.read_csv(train_url)
          test_df = pd.read_csv(test_url)

          X_train = train_df.drop(columns=["ProdTaken"])
          y_train = train_df["ProdTaken"]

          X_test = test_df.drop(columns=["ProdTaken"])
          y_test = test_df["ProdTaken"]

          numerical_features = X_train.select_dtypes(
              include=["int64", "float64"]
          ).columns.tolist()

          categorical_features = X_train.select_dtypes(
              include=["object"]
          ).columns.tolist()

          preprocessor = ColumnTransformer(
              transformers=[
                  (
                      "num",
                      "passthrough",
                      numerical_features
                  ),
                  (
                      "cat",
                      OneHotEncoder(handle_unknown="ignore"),
                      categorical_features
                  )
              ]
          )

          X_train_processed = preprocessor.fit_transform(X_train)
          X_test_processed = preprocessor.transform(X_test)

          param_grid = {
              "n_estimators": [100, 200, 300],
              "max_depth": [None, 10, 20],
              "min_samples_split": [2, 5],
              "min_samples_leaf": [1, 2]
          }

          rf = RandomForestClassifier(
              class_weight="balanced",
              random_state=42,
              n_jobs=-1
          )

          grid_search = GridSearchCV(
              estimator=rf,
              param_grid=param_grid,
              scoring="f1",
              cv=5,
              n_jobs=-1
          )

          mlflow.set_tracking_uri("sqlite:///mlflow.db")
          mlflow.set_experiment("Tourism Package Prediction")

          with mlflow.start_run(
              run_name="Random Forest GridSearch"
          ):

              grid_search.fit(
                  X_train_processed,
                  y_train
              )

              best_model = grid_search.best_estimator_

              predictions = best_model.predict(
                  X_test_processed
              )

              accuracy = accuracy_score(
                  y_test,
                  predictions
              )

              precision = precision_score(
                  y_test,
                  predictions,
                  zero_division=0
              )

              recall = recall_score(
                  y_test,
                  predictions,
                  zero_division=0
              )

              f1 = f1_score(
                  y_test,
                  predictions,
                  zero_division=0
              )

              mlflow.log_params(
                  grid_search.best_params_
              )

              mlflow.log_metric(
                  "accuracy",
                  accuracy
              )

              mlflow.log_metric(
                  "precision",
                  precision
              )

              mlflow.log_metric(
                  "recall",
                  recall
              )

              mlflow.log_metric(
                  "f1_score",
                  f1
              )

              mlflow.set_tag(
                  "model_type",
                  "Random Forest"
              )

              mlflow.set_tag(
                  "project",
                  "Tourism Package Prediction"
              )

              print("Best parameters:")
              print(grid_search.best_params_)

              print("Accuracy:", accuracy)
              print("Precision:", precision)
              print("Recall:", recall)
              print("F1 Score:", f1)

          os.makedirs("model", exist_ok=True)

          joblib.dump(
              best_model,
              "model/final_random_forest_model.pkl"
          )

          joblib.dump(
              preprocessor,
              "model/preprocessor.pkl"
          )

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj="model/final_random_forest_model.pkl",
              path_in_repo="final_random_forest_model.pkl",
              repo_id="Muleex12/tourism-package-prediction-model",
              repo_type="model"
          )

          api.upload_file(
              path_or_fileobj="model/preprocessor.pkl",
              path_in_repo="preprocessor.pkl",
              repo_id="Muleex12/tourism-package-prediction-model",
              repo_type="model"
          )

          print(
              "Final model and preprocessor registered "
              "on Hugging Face Model Hub."
          )
          PY

      - name: Upload MLflow database artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking-database
          path: mlflow.db


  # ============================================================
  # 4. STREAMLIT DEPLOYMENT
  # ============================================================
  deploy:
    needs: model-training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub
        run: |
          pip install huggingface_hub

      - name: Deploy Streamlit application to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_folder(
              folder_path="deployment",
              repo_id="Muleex12/tourism-package-prediction-app",
              repo_type="space"
          )

          print(
              "Streamlit deployment successfully uploaded "
              "to Hugging Face Space."
          )
          PY


  # ============================================================
  # 5. AUTOMATICALLY PUSH PROJECT UPDATES TO MAIN
  # ============================================================
  update-main:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record successful pipeline update
        run: |
          echo "Tourism Package Prediction MLOps Pipeline" > pipeline_update.txt
          echo "Pipeline execution completed successfully." >> pipeline_update.txt
          echo "Data registration: completed" >> pipeline_update.txt
          echo "Data preparation: completed" >> pipeline_update.txt
          echo "Model training and MLflow tracking: completed" >> pipeline_update.txt
          echo "Streamlit deployment: completed" >> pipeline_update.txt

      - name: Commit and automatically push update to main
        run: |
          git add pipeline_update.txt

          git commit -m "Automated MLOps pipeline update [skip ci]" || echo "No changes to commit."

          git push origin main

          echo "Project update automatically pushed to main."
